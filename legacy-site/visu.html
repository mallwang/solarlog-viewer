        yTxt=" kW/kWp"
        TagMax=1

    }

    D.YScale=yTxt
    D.Draw(aw_blau, aw_black, false);
    D.GetYGrid()
    var lDate;
    var i,i2, x,x1,x2,y, yErtrag, dt, wrI, MessZeit;
    i=0;
    var aWRX=new Array(AnzahlWR)
    var aWRY=new Array(AnzahlWR)

    var aStringY=new Array(3)

    var aXC=new Array(), aYC=new Array(), aYC, CMax=0, mC,cC
    max = 0;
    
    while( i<m.length ) {
        dt = getWRToken( m[i], 0 )
        if( dt.substring(0,8)==sToday ) {
            lDate = new Date( parseInt(dt.substring(6,8),10)+2000, dt.substring(3,5)-1, dt.substring(0,2), dt.substring(9,11)-(-tzo), dt.substring(12,14), dt.substring(15,17) ).getTime()
            datum = new Date( lDate-Intervall*1000 )
            x1=D.ScreenX( datum );
            datum = new Date( lDate )
            x2=D.ScreenX( datum );
            datum = new Date( lDate-Intervall/2*1000 )
            x=D.ScreenX( datum );
            if( inv & Math.pow(2,31) ) {
                y = 0;
                yErtrag = 0
                mU = 0
                cU = 0
                mC = 0
                cC = 0
                Pspez = 1
                for( wrI=1; wrI<=AnzahlWR; wrI++ ) {
                    data = enumData( m[i], wrI );

                        if( data[1+WRInfo[wrI-1][5]+1]!=null )

                    }

                                for( var s=0;s<WRInfo[wrI-1][5];s++ ) {
                                    if( WRInfo[wrI-1][7][s]!=0 ) {
                                        mU+=data[1+WRInfo[wrI-1][5]+1+s+1]
                                        cU++
                                    }
                                }
                            }
                            else {
                                mU+=data[1+WRInfo[wrI-1][5]+1+0+1]
                                cU++
                            }
                        }
                    }
                    if( flag&4 ) {
                        Pspez += WRInfo[wrI-1][2]
                    }
                    if( isTemp && flag&8 ) { // Temp
                        if( data[1+WRInfo[wrI-1][5]*2+1+1]!=null ) {
                            mC+=data[1+WRInfo[wrI-1][5]*2+1+1]
                            cC++
                        }
                    }
                }
                if( y>0 ) {
				    new Bar(x1, D.ScreenY(y/Pspez), x2, D.ScreenY(0), aw_gelb, "", aw_white, (Math.floor(y/Pspez*100)/100)+yTxt+" - "+formatDT(dt));
                    if (y>max ) {
                        max=y
                    }

                    aXErtrag[aXErtrag.length] = x
                    aYErtrag[aYErtrag.length] = yErtrag

                if( cU>0 ) {

                        UMax = aYU[aYU.length-1][0]

//==================== M O N A T ==================== Modus=1
function monat() {
    D.SetBorder( Date.UTC( today.getFullYear(),today.getMonth(),1,0,0,0), Date.UTC(today.getFullYear(),today.getMonth(),nod,23,59,0,0), 0, getMaxWRP() );
    D.YScale="function kWYScale"
    D.XScalePosition="bottom-right"
    D.XScale="function monatXScale"
    D.GetXGrid()
    D.XGridDelta=86400000
    D.Draw(aw_blau, aw_black, false);
    var balken_breite = deltax / nod
    var i, x, y, oldY, dt;

    var dDate
    var days=new Array(31), daystyp=new Array(31)
    for(i=0;i<31;i++) {
        days[i]=""
        daystyp[i]=0
    }
    for(i=dal.length-1;i>=0;i--) {
        dt = getWRToken( dal[i], 0 )
        if( dt.substring(3,8)==sToday.substring(3,8) ) {
            dDate = new Date( parseInt(dt.substring(6,8),10)+2000, parseInt(dt.substring(3,5),10)-1, parseInt(dt.substring(0,2),10) )
            x=dDate.getDate()
            days[x-1]=dal[i]
            daystyp[x-1]=1
        }
    }
    for(i=da.length-1;i>=0;i--) {
        dt = getWRToken( da[i], 0 )
        if( dt.substring(3,8)==sToday.substring(3,8) ) {
            dDate = new Date( parseInt(dt.substring(6,8),10)+2000, parseInt(dt.substring(3,5),10)-1, parseInt(dt.substring(0,2),10) )
            x=dDate.getDate()
            days[x-1]=da[i]
            daystyp[x-1]=2
        }
    }
    max=0;
    i=0;
    sum=0;
    aw_tage =0;

    for (j=0;j<31;j++)
      wdays[j]=null

    while( i<31 ) {
        dt = getWRToken( days[i], 0 )
        if( dt.substring(3,8)==sToday.substring(3,8) ) {
            aw_tage ++;
            datum = new Date( parseInt(dt.substring(6,8),10)+2000, dt.substring(3,5)-1, dt.substring(0,2), 14, 0, 0 )
            x = D.ScreenX( datum );
            if( inv & Math.pow(2,31) ) {
                y=0
                if( daystyp[i]==1 ) {
                    data = enumData( days[i], 1 );
                    y += data[1];
                    sum += data[1];
                }
                else {
                    for( wrI=1; wrI<=AnzahlWR; wrI++ ) {
                        data = enumData( days[i], wrI );
                        y += data[1];
                        sum += data[1];
                    }
                }
                if( y>max ) {
                    max=y
                }
                if( y>0 ) {
                    new Bar(x-5, D.ScreenY(y), x+5, D.ScreenY(0), aw_gelb, "", aw_white, aw_fmt0(y/100/10)+" kWh/"+aw_fmt0(y/AnlagenKWP)+" kWhp","GoDay("+datum.getFullYear()+","+datum.getMonth()+","+datum.getDate()+")" );
                    wdays[i] = y
                }
            }
            y=0
            oldY=0
            for( wrI=1; wrI<=AnzahlWR; wrI++ ) {
                if( inv & Math.pow(2,wrI) && daystyp[i]==2 ) {
                    data = enumData( days[i], wrI );
                    y = data[1]
                    if( !(inv & Math.pow(2,31)) ) {
                        sum += y;
                        wdays[i] += y }
                    if( y>0 ) {
                        new Bar(x-0, D.ScreenY(oldY+y), x+8, D.ScreenY(oldY), WRCol[wrI-1], "", aw_white, aw_fmt0(y/100/10)+" kWh/"+aw_fmt0(y/AnlagenKWP)+" kWhp","GoDay("+datum.getFullYear()+","+datum.getMonth()+","+datum.getDate()+")" );
                        oldY += y
                        if( oldY>max ) {
                            max=oldY
                        }
                    }
                }
            }
        }
        i++;
    }
    if(today.getFullYear() == indate.getFullYear() && today.getMonth() < indate.getMonth()) {
        soll = 0;
    } else { 
        soll=SollYearKWP* ( sollMonth[today.getMonth()]/nod)/100*getCurAnlagenKWP()
    }
	new Line( D.left+2, D.ScreenY(soll), D.right-1, D.ScreenY(soll), "#66FF00", 2, "Tagessoll "+(Math.floor(soll/100)/10)+" kWh" )
    if( offset == 0 ) {
        if(today.getFullYear() == indate.getFullYear() && today.getMonth() == indate.getMonth()) {
            var abzug = SollYearKWP* ( sollMonth[today.getMonth()]/nod*(indate.getDate()-1) )/100*getCurAnlagenKWP();
            soll=(SollYearKWP* ( sollMonth[today.getMonth()]/nod*heute.getDate() )/100*getCurAnlagenKWP())-abzug
        } else {
            soll=SollYearKWP* ( sollMonth[today.getMonth()]/nod*heute.getDate() )/100*getCurAnlagenKWP()
        }
    } else { 
        if(today.getFullYear() == indate.getFullYear() && today.getMonth() == indate.getMonth()) {
            var abzug = SollYearKWP* ( sollMonth[today.getMonth()]/nod*(indate.getDate()-1) )/100*getCurAnlagenKWP();
            soll=SollYearKWP* sollMonth[today.getMonth()]/100*getCurAnlagenKWP()-abzug
        } else {
            soll=SollYearKWP* sollMonth[today.getMonth()]/100*getCurAnlagenKWP()
        }
    }
    if( soll == 0 )
        soll=1;
    ist=sum/soll*100
}

    i=0;
    sum=0

    for (j=0;j<12;j++)
      wmonth[j]=null

    while( i<mo.length ) {

            x = D.ScreenX( datum );
            if( inv & Math.pow(2,31) ) {
                y=0
                for( wrI=1; wrI<=AnzahlWR; wrI++ ) {
                    data = enumData( mo[i], wrI );
                    y += data[1];
                    sum += data[1];
                    if( offset==0 && (dt.substring(3,5)-1)==heute.getMonth() && dx>0 ) {
                        data2 = enumData( da[0], wrI )
                        y += data2[1]
                        sum += data2[1]
                    }
                }
                if( y>max ) {
                    max=y
                }
                if( y>0 ) {
                    new Bar(x-(balken_breite/2-12), D.ScreenY(y), x+(balken_breite/2-10), D.ScreenY(0), aw_gelb, "", aw_white, aw_fmt0(y/1000)+" kWh/"+aw_fmt0(y/AnlagenKWP)+" kWhp","GoMonth("+datum.getFullYear()+","+datum.getMonth()+")");

                    wmonth[parseInt(dt.substring(3,5),10)-1] = y
                }
            }
            y=0
            oldY=0
            for( wrI=1; wrI<=AnzahlWR; wrI++ ) {
                if( inv & Math.pow(2,wrI) ) {
                    data = enumData( mo[i], wrI );
                    y = data[1]
                    if( !(inv & Math.pow(2,31)) ) {
                        sum += y;
                        if( offset==0 && (dt.substring(3,5)-1)==heute.getMonth() && dx>0 ) {
                            data2 = enumData( da[0], wrI )
                            y += data2[1]
                            sum += data2[1]
                        }
                        wmonth[parseInt(dt.substring(3,5),10)-1] += y
                    }
                    if( y>0 ) {   
                        new Bar(x-(balken_breite/2.2-16), D.ScreenY(oldY+y), x+(balken_breite/2.2-7), D.ScreenY(oldY), WRCol[wrI-1], "", aw_white, aw_fmt0(y/1000)+" kWh/"+aw_fmt0(y/AnlagenKWP)+" kWhp","GoMonth("+datum.getFullYear()+","+datum.getMonth()+")");
                        oldY += y
                        if( oldY>max ) {
                            max=oldY
                        }
                    }
                }
            }
        }
        i++;
    }

    // Monats-Soll Linien zeichnen
    for( i=0; i<12; i++) {
        datum = new Date( today.getFullYear(), i, 16, 0, 0, 0 )
        x = D.ScreenX( datum );
        if(datum.getFullYear() < indate.getFullYear()) {
            y = 0;
        } else if (datum.getFullYear() == indate.getFullYear() && i < indate.getMonth()) {
            y = 0;
        } else if (datum.getFullYear() == indate.getFullYear() && i == indate.getMonth()) {
            var abzug = SollYearKWP* ( sollMonth[i]/nod*(indate.getDate()-1) )/100*getCurAnlagenKWP();
            y=sollMonth[i]*SollYearKWP/100*getCurAnlagenKWP()-abzug
        } else {
            y=sollMonth[i]*SollYearKWP/100*getCurAnlagenKWP()
        }
        new Bar(x-(balken_breite/1.8-12), D.ScreenY(y), x+(balken_breite/1.8-10), D.ScreenY(y-getMaxWRP()/80), aw_soll, "", aw_white, getText(LBL_SOLL)+" "+Math.floor(y/1000)+" kWh","GoMonth("+datum.getFullYear()+","+i+")");
		if(datum.getFullYear() == heute.getFullYear() && i == heute.getMonth()) {
		    y=SollYearKWP* ( sollMonth[i]/nod*heute.getDate() )/100*getCurAnlagenKWP();
		}
		wmsoll[i] = y
    }

    soll=0
    if( offset == 0 )
        y = heute.getMonth()+1;
    else
        y = 12
    for( i=0; i< y; i++) {
        if( datum.getFullYear() < indate.getFullYear() ) {
            soll += 0;
        } else if (datum.getFullYear() == indate.getFullYear() && i < indate.getMonth()) {
            soll += 0;
        } else if (datum.getFullYear() == indate.getFullYear() && i == indate.getMonth()) {
            if(today.getFullYear() == datum.getFullYear() && i == heute.getMonth()) {
                soll +=sollMonth[indate.getMonth()]/nod*((nod-(indate.getDate()-1))+nod-heute.getDate())
            } else {
                soll +=sollMonth[indate.getMonth()]/nod*(nod-(indate.getDate()-1))
            }
        } else {
            if(today.getFullYear() == datum.getFullYear() && i == heute.getMonth()) {
                soll +=sollMonth[heute.getMonth()]*heute.getDate()/nod;
            } else {
                soll +=sollMonth[i];
            }
        }
    }
    soll=SollYearKWP*soll/100*getCurAnlagenKWP()
    ist=sum/soll*100
    // Prognoseberechnung
    var progSollSum=0
    if( offset == 0 ) {
        y = heute.getMonth()+1;
        for( i=y-1; i< 12; i++) {
            if( offset == 0 && i == y-1 )
                progSollSum += getSollMonth(heute.getMonth())/nod*(nod-heute.getDate())
            else
                progSollSum += getSollMonth(i)
        }
    }
    progSollSum += sum/getCurAnlagenKWP()
    prognose="("+getText(LBL_PROGNOSE)+" : "+Math.floor(progSollSum)+" kWh/kWp)"
}

         case 3: // Gesamt�bersicht: �bersicht alle Jahre: Flag Werte gesetzt, rechts unten: Jahreswerte anzeigen
		 case 4:
          esum=0
		  esoll=0
          document.write("</tr>")
          for (i=0;i<ye.length;i++) {
		      eysoll=0;
              startyear = today.getFullYear()
              esum = esum+wyears[i]
              document.write("<tr>")
              writeTD("<a href=visu.html?mode=2\&offset=" + (startyear-hyear-i) + "\&flag="+flag+">" + (hyear-i) + "</a>");
              writeTD(aw_fmt0(wyears[i]/1000));
              writeTD(aw_fmt0(wyears[i]/AnlagenKWP));
              if ((hyear-i) == indate.getFullYear()) {
				  var abzug = 0;
				  for(j=0; j<12; j++) {
			          if (j == indate.getMonth()) {
                        var abzug = SollYearKWP* ( sollMonth[j]/nod*(indate.getDate()-1) )/100*getCurAnlagenKWP();
                        eysoll+=sollMonth[j]*SollYearKWP/100*getCurAnlagenKWP()-abzug
                      } else if (j > indate.getMonth()) {
                          eysoll+=sollMonth[j]*SollYearKWP/100*getCurAnlagenKWP()
                      }
				  }
				  eysoll=Math.floor(eysoll/1000);
              } else if((hyear-i) == startyear) {
			      for(j=0; j<today.getMonth(); j++)
				      eysoll+=sollMonth[j]*SollYearKWP/100*getCurAnlagenKWP();
                  eysoll=Math.floor(eysoll/1000);
                  eysoll+=Math.floor((sollMonth[today.getMonth()]/100*SollYearKWP*getCurAnlagenKWP()/1000)/nod*today.getDate())
			  } else {
                  eysoll=Math.floor(SollYearKWP*AnlagenKWP/1000)
	          }
              writeTD(eysoll);
			  esoll +=eysoll
			  wpysoll = aw_fmt0(wyears[i]/1000/eysoll*100)
              if (wpysoll < 100)
                writeTD("<font color=#B30000>"+ wpysoll + "</font>");
              else
                writeTD(wpysoll);
              document.write("</tr>")
          }
          document.write("<tr>")
          writeTD("<b>"+getText(LBL_VISU_SUMME)+"<\/b>");
          writeTD("<b>"+aw_fmt0(esum/1000)+"<\/b>");
          writeTD("<b>"+aw_fmt0(esum/AnlagenKWP/ye.length)+"<\/b>");
          writeTD("<b>"+esoll+"<\/b>");
          wpysoll=aw_fmt0(esum/1000*100/esoll)
          if (wpysoll < 100)
              writeTD("<b><font color=#B30000>"+wpysoll+"<\/font><\/b>");
          else
              writeTD("<b>"+wpysoll+"<\/b>");
		  break;
        default:
    }
	writeTABLE_END();

  document.write("<\/p>")
 }
