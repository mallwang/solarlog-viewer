    - Reproduce the real header's structure/classes loosely (brand, nav, actions) so the mockup
      reads as "inside the app," not a generic page.
    - Pull colors from the CURRENT web/css/tokens.css, not from this file — tokens.css may have

    - Collapse it for the mobile viewport the same way the real header does (see the

<div class="app-header">
