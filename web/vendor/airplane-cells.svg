<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <!--
    airplane-cells.svg — 10-frame horizontal sprite strip, 900×90 px (each frame 90×90 px).
    Twin-engine jet faces RIGHT (for left-to-right flight). Swept wings with under-wing turbofan
    nacelles; jet exhaust flickers per frame. Red nose cap, blue cockpit canopy.
    Animate with: background-position-x 0 → -900px, steps(10), to cycle all frames.
  -->
  <defs>
    <!-- Static jet body (frame-0 local space; reused in every frame via <use translate>) -->
    <g id="jet">
      <!-- Vertical fin (tail, left side) -->
      <path d="M16,43 L9,30 L14,43Z" fill="#2a2a2a"/>
      <!-- Upper horizontal stabiliser -->
      <path d="M16,43 L6,43 L4,34 L12,36Z" fill="#383838"/>
      <!-- Lower horizontal stabiliser -->
      <path d="M16,47 L6,47 L4,56 L12,54Z" fill="#383838"/>
      <!-- Upper main wing (swept back toward tail) -->
      <path d="M52,43 L36,43 L18,18 L25,18Z" fill="#383838"/>
      <!-- Lower main wing (swept back toward tail) -->
      <path d="M52,47 L36,47 L18,72 L25,72Z" fill="#383838"/>
      <!-- Engine pylons (wing to nacelle struts) -->
      <path d="M31,22 L34,22 L35,43 L32,43Z" fill="#2a2a2a"/>
      <path d="M31,68 L34,68 L35,47 L32,47Z" fill="#2a2a2a"/>
      <!-- Upper engine nacelle -->
      <ellipse cx="32" cy="26" rx="10" ry="5"   fill="#3a3a3a"/>
      <ellipse cx="41" cy="26" rx="3.5" ry="4"  fill="#2a2a2a"/>
      <ellipse cx="22" cy="26" rx="3"   ry="3.5" fill="#111"/>
      <ellipse cx="32" cy="23.5" rx="8" ry="1.8" fill="rgba(255,255,255,0.12)"/>
      <!-- Lower engine nacelle -->
      <ellipse cx="32" cy="64" rx="10" ry="5"   fill="#3a3a3a"/>
      <ellipse cx="41" cy="64" rx="3.5" ry="4"  fill="#2a2a2a"/>
      <ellipse cx="22" cy="64" rx="3"   ry="3.5" fill="#111"/>
      <ellipse cx="32" cy="61.5" rx="8" ry="1.8" fill="rgba(255,255,255,0.12)"/>
      <!-- Fuselage (drawn over wing roots) -->
      <path d="M74,45 C70,40 57,40 41,42 L19,43 Q14,43 12,45 Q14,47 19,47 L41,48 C57,50 70,50 74,45Z" fill="#2a2a2a"/>
      <!-- Fuselage top sheen -->
      <path d="M42,41 C55,40 66,41 72,43" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Red nose cap -->
      <path d="M67,43 C70,41 74,44 74,45 C74,46 70,49 67,47Z" fill="#cc2200"/>
      <!-- Cockpit canopy -->
      <ellipse cx="61" cy="42" rx="6.5" ry="3.5" fill="#2a5a8a"/>
      <ellipse cx="61" cy="42" rx="5"   ry="2.5" fill="#4a9ad4"/>
    </g>
  </defs>

  <!-- Frame 0: small exhaust (h=5) -->
  <g transform="translate(0,0)">
    <use href="#jet"/>
    <path d="M20,23 Q18,21 15,26 Q18,31 20,29Z" fill="#e85d00"/>
    <path d="M20,24 Q19,22 17,26 Q19,29 20,28Z" fill="#ffd700"/>
    <path d="M20,61 Q18,59 15,64 Q18,69 20,67Z" fill="#e85d00"/>
    <path d="M20,62 Q19,60 17,64 Q19,68 20,66Z" fill="#ffd700"/>
  </g>

  <!-- Frame 1: medium-large exhaust (h=9) -->
  <g transform="translate(90,0)">
    <use href="#jet"/>
    <path d="M20,22 Q16,18 11,26 Q16,34 20,30Z" fill="#e85d00"/>
    <path d="M20,23 Q18,20 15,26 Q18,32 20,29Z" fill="#ffd700"/>
    <path d="M20,60 Q16,56 11,64 Q16,72 20,68Z" fill="#e85d00"/>
    <path d="M20,61 Q18,58 15,64 Q18,70 20,67Z" fill="#ffd700"/>
  </g>

  <!-- Frame 2: medium exhaust (h=7) -->
  <g transform="translate(180,0)">
    <use href="#jet"/>
    <path d="M20,23 Q17,21 13,26 Q17,31 20,29Z" fill="#e85d00"/>
    <path d="M20,24 Q18,22 16,26 Q18,30 20,28Z" fill="#ffd700"/>
    <path d="M20,61 Q17,59 13,64 Q17,69 20,67Z" fill="#e85d00"/>
    <path d="M20,62 Q18,60 16,64 Q18,68 20,66Z" fill="#ffd700"/>
  </g>

  <!-- Frame 3: large exhaust (h=11) -->
  <g transform="translate(270,0)">
    <use href="#jet"/>
    <path d="M20,21 Q15,17 9,26 Q15,35 20,31Z" fill="#e85d00"/>
    <path d="M20,22 Q17,19 14,26 Q17,34 20,30Z" fill="#ffd700"/>
    <path d="M20,59 Q15,55 9,64 Q15,73 20,69Z" fill="#e85d00"/>
    <path d="M20,60 Q17,57 14,64 Q17,72 20,68Z" fill="#ffd700"/>
  </g>

  <!-- Frame 4: tiny exhaust (h=4) -->
  <g transform="translate(360,0)">
    <use href="#jet"/>
    <path d="M20,24 Q18,22 16,26 Q18,30 20,28Z" fill="#e85d00"/>
    <path d="M20,25 Q19,24 18,26 Q19,28 20,27Z" fill="#ffd700"/>
    <path d="M20,62 Q18,60 16,64 Q18,68 20,66Z" fill="#e85d00"/>
    <path d="M20,63 Q19,62 18,64 Q19,66 20,65Z" fill="#ffd700"/>
  </g>

  <!-- Frame 5: medium exhaust (h=8) -->
  <g transform="translate(450,0)">
    <use href="#jet"/>
    <path d="M20,22 Q16,18 12,26 Q16,34 20,30Z" fill="#e85d00"/>
    <path d="M20,23 Q18,21 16,26 Q18,31 20,29Z" fill="#ffd700"/>
    <path d="M20,60 Q16,56 12,64 Q16,72 20,68Z" fill="#e85d00"/>
    <path d="M20,61 Q18,59 16,64 Q18,69 20,67Z" fill="#ffd700"/>
  </g>

  <!-- Frame 6: large exhaust (h=11) -->
  <g transform="translate(540,0)">
    <use href="#jet"/>
    <path d="M20,21 Q15,17 9,26 Q15,35 20,31Z" fill="#e85d00"/>
    <path d="M20,22 Q17,19 14,26 Q17,34 20,30Z" fill="#ffd700"/>
    <path d="M20,59 Q15,55 9,64 Q15,73 20,69Z" fill="#e85d00"/>
    <path d="M20,60 Q17,57 14,64 Q17,72 20,68Z" fill="#ffd700"/>
  </g>

  <!-- Frame 7: small-medium exhaust (h=6) -->
  <g transform="translate(630,0)">
    <use href="#jet"/>
    <path d="M20,23 Q17,21 14,26 Q17,31 20,29Z" fill="#e85d00"/>
    <path d="M20,24 Q19,22 17,26 Q19,30 20,28Z" fill="#ffd700"/>
    <path d="M20,61 Q17,59 14,64 Q17,69 20,67Z" fill="#e85d00"/>
    <path d="M20,62 Q19,60 17,64 Q19,68 20,66Z" fill="#ffd700"/>
  </g>

  <!-- Frame 8: medium-large exhaust (h=9) -->
  <g transform="translate(720,0)">
    <use href="#jet"/>
    <path d="M20,22 Q16,18 11,26 Q16,34 20,30Z" fill="#e85d00"/>
    <path d="M20,23 Q18,20 15,26 Q18,32 20,29Z" fill="#ffd700"/>
    <path d="M20,60 Q16,56 11,64 Q16,72 20,68Z" fill="#e85d00"/>
    <path d="M20,61 Q18,58 15,64 Q18,70 20,67Z" fill="#ffd700"/>
  </g>

  <!-- Frame 9: tiny exhaust (h=4) -->
  <g transform="translate(810,0)">
    <use href="#jet"/>
    <path d="M20,24 Q18,22 16,26 Q18,30 20,28Z" fill="#e85d00"/>
    <path d="M20,25 Q19,24 18,26 Q19,28 20,27Z" fill="#ffd700"/>
    <path d="M20,62 Q18,60 16,64 Q18,68 20,66Z" fill="#e85d00"/>
    <path d="M20,63 Q19,62 18,64 Q19,66 20,65Z" fill="#ffd700"/>
  </g>
</svg>
