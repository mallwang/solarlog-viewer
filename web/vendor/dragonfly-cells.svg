<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <!--
    dragonfly-cells.svg — 10-frame horizontal sprite strip, 900×90 px (90×90 per frame).
    Top-down view; dark green segmented body, flying LEFT. Four translucent wings beat
    at high apparent frequency — front pair (cx=33) and rear pair (cx=45) step through
    10 spread positions in an irregular rhythm to suggest rapid vibration.
    Animate with: background-position-x 0 → -900px, steps(10), fast (~0.25s).
  -->
  <defs>
    <!-- Static body: head + thorax + segmented abdomen, all flying LEFT -->
    <g id="drfly">
      <!-- Abdomen (tapered, left = front) -->
      <path d="M35,44 C52,43 67,44 72,45 C67,46 52,47 35,46Z" fill="#2a7a1a"/>
      <!-- Abdomen segment lines -->
      <line x1="44" y1="44" x2="44" y2="46" stroke="#1a5010" stroke-width="0.8"/>
      <line x1="52" y1="43.5" x2="52" y2="46.5" stroke="#1a5010" stroke-width="0.8"/>
      <line x1="60" y1="44" x2="60" y2="46" stroke="#1a5010" stroke-width="0.8"/>
      <line x1="67" y1="44.2" x2="67" y2="45.8" stroke="#1a5010" stroke-width="0.8"/>
      <!-- Thorax -->
      <rect x="24" y="42" width="13" height="6" rx="3" fill="#1a5a0a"/>
      <!-- Head (large compound eyes) -->
      <circle cx="19" cy="45" r="5" fill="#1a4a0a"/>
      <circle cx="17" cy="43" r="2.5" fill="#3a8a20"/>
      <circle cx="21" cy="43" r="2.5" fill="#3a8a20"/>
      <!-- Eye highlights -->
      <circle cx="17" cy="42.5" r="0.8" fill="rgba(255,255,255,0.4)"/>
      <circle cx="21" cy="42.5" r="0.8" fill="rgba(255,255,255,0.4)"/>
    </g>
  </defs>

  <!-- Frame 0: wy_f=22, wy_r=18 -->
  <g transform="translate(0,0)">
    <ellipse cx="33" cy="23" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="67" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="27" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="63" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 1: wy_f=20, wy_r=16 -->
  <g transform="translate(90,0)">
    <ellipse cx="33" cy="25" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="65" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="29" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="61" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 2: wy_f=16, wy_r=12 -->
  <g transform="translate(180,0)">
    <ellipse cx="33" cy="29" rx="15" ry="3.5" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="61" rx="15" ry="3.5" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="33" rx="12" ry="3" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="57" rx="12" ry="3" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 3: wy_f=11, wy_r=9 (wings nearly closed = fast beat midpoint) -->
  <g transform="translate(270,0)">
    <ellipse cx="33" cy="34" rx="13" ry="3" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="56" rx="13" ry="3" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="36" rx="11" ry="2.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="54" rx="11" ry="2.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 4: wy_f=17, wy_r=14 -->
  <g transform="translate(360,0)">
    <ellipse cx="33" cy="28" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="62" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="31" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="59" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 5: wy_f=22, wy_r=18 (same as frame 0 — fast repeat) -->
  <g transform="translate(450,0)">
    <ellipse cx="33" cy="23" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="67" rx="16" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="27" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="63" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 6: wy_f=19, wy_r=15 -->
  <g transform="translate(540,0)">
    <ellipse cx="33" cy="26" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="64" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="30" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="60" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 7: wy_f=15, wy_r=11 -->
  <g transform="translate(630,0)">
    <ellipse cx="33" cy="30" rx="14" ry="3.5" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="60" rx="14" ry="3.5" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="34" rx="12" ry="3" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="56" rx="12" ry="3" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 8: wy_f=12, wy_r=8 (wings nearly closed again) -->
  <g transform="translate(720,0)">
    <ellipse cx="33" cy="33" rx="13" ry="3" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="57" rx="13" ry="3" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="37" rx="11" ry="2.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="53" rx="11" ry="2.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>

  <!-- Frame 9: wy_f=18, wy_r=15 -->
  <g transform="translate(810,0)">
    <ellipse cx="33" cy="27" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="33" cy="63" rx="15" ry="4" fill="rgba(200,235,255,0.75)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="30" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <ellipse cx="45" cy="60" rx="13" ry="3.5" fill="rgba(210,240,255,0.7)" stroke="rgba(100,160,200,0.5)" stroke-width="0.6"/>
    <use href="#drfly"/>
  </g>
</svg>
