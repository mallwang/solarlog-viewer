<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolarLog Viewer</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tailwind.generated.css" />
    <link rel="icon" type="image/x-icon" href="favicon-v2.ico" />
  </head>
  <body>
    <!-- Static full-coverage overcast backdrop (cloudy/rain/snow): a fixed, unfiltered layer
         behind `.sky-clouds` — sibling, not descendant, so it stays outside `.sky-clouds`'s
         contrast filter and reads as a smooth, flat cloud ceiling rather than the gooey
         "fused circles" look. `sky-controller.js` toggles it via `data-weather` on <body> (see
         app.css's `body[data-weather] .sky-overcast` rules) — the up-to-sixteen `.cloud` puffs
         inside `.sky-clouds` then drift in front of it, giving these categories a "completely
         clouded heaven" base with moving texture layered on top, instead of gaps showing the
         plain page background. -->
    <div class="sky-overcast" aria-hidden="true"></div>
    <div class="sky-clouds" aria-hidden="true">
      <!-- Positioned/shown by sky-controller.js (User Story 2): --x-percent/--y-percent custom
           properties and opacity are set on a 60-second tick from computeSkyBodyPosition().
           Placed before the .cloud elements so the clouds always paint on top of the sun/moon —
           mimicking the real sky, where cloud cover passes in front of the sun, not behind it. -->
      <div class="sky-sun" aria-hidden="true" style="--x-percent: 50; --y-percent: 100"></div>
      <div class="sky-moon" aria-hidden="true" style="--x-percent: 50; --y-percent: 100"></div>
      <div
        class="cloud"
        style="--top: 8%; --scale: 1.4; --duration: 75s; --delay: 0s; --rest-x: 5vw"
      ></div>
      <div
        class="cloud"
        style="--top: 18%; --scale: 0.8; --duration: 50s; --delay: -20s; --rest-x: 30vw"
      ></div>
      <div
        class="cloud"
        style="--top: 4%; --scale: 1; --duration: 65s; --delay: -45s; --rest-x: 60vw"
      ></div>
      <div
        class="cloud"
        style="--top: 24%; --scale: 1.6; --duration: 90s; --delay: -10s; --rest-x: 80vw"
      ></div>
      <div
        class="cloud"
        style="--top: 14%; --scale: 0.6; --duration: 40s; --delay: -30s; --rest-x: 45vw"
      ></div>
      <div
        class="cloud"
        style="--top: 30%; --scale: 1.1; --duration: 80s; --delay: -60s; --rest-x: 10vw"
      ></div>
      <!-- Ten more `.cloud` elements (indices 6-15), hidden by default so the pre-feature/
           fallback appearance (no JS, or weather resolution failed) still shows exactly the
           original six. `sky-controller.js` un-hides as many as a category's `visibleCount`
           needs (mixed: 10, cloudy/rain/snow: 16) via applyWeatherCategory(). -->
      <div
        class="cloud"
        hidden
        style="--top: 20%; --scale: 1.2; --duration: 55s; --delay: -15s; --rest-x: 15vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 10%; --scale: 0.9; --duration: 70s; --delay: -35s; --rest-x: 50vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 26%; --scale: 1.3; --duration: 85s; --delay: -5s; --rest-x: 70vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 6%; --scale: 0.7; --duration: 45s; --delay: -50s; --rest-x: 90vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 16%; --scale: 1; --duration: 60s; --delay: -25s; --rest-x: 35vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 28%; --scale: 1.5; --duration: 95s; --delay: -70s; --rest-x: 65vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 22%; --scale: 0.85; --duration: 52s; --delay: -40s; --rest-x: 25vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 12%; --scale: 1.15; --duration: 68s; --delay: -8s; --rest-x: 55vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 2%; --scale: 0.75; --duration: 58s; --delay: -55s; --rest-x: 78vw"
      ></div>
      <div
        class="cloud"
        hidden
        style="--top: 32%; --scale: 1.4; --duration: 88s; --delay: -18s; --rest-x: 95vw"
      ></div>
      <!-- Rain/snow particle layers (User Story 1): visibility driven entirely by app.css's
           `.sky-clouds[data-weather='rain'|'snow']` rules — sky-controller.js only ever sets
           `data-weather`, never touches these elements directly. -->
      <div class="sky-rain" aria-hidden="true">
        <div class="sky-rain-drop" style="--left: 6%; --duration: 0.7s; --delay: 0s"></div>
        <div class="sky-rain-drop" style="--left: 18%; --duration: 0.9s; --delay: -0.3s"></div>
        <div class="sky-rain-drop" style="--left: 32%; --duration: 0.75s; --delay: -0.6s"></div>
        <div class="sky-rain-drop" style="--left: 47%; --duration: 0.85s; --delay: -0.2s"></div>
        <div class="sky-rain-drop" style="--left: 61%; --duration: 0.65s; --delay: -0.5s"></div>
        <div class="sky-rain-drop" style="--left: 74%; --duration: 0.95s; --delay: -0.1s"></div>
        <div class="sky-rain-drop" style="--left: 88%; --duration: 0.8s; --delay: -0.4s"></div>
      </div>
      <div class="sky-snow" aria-hidden="true">
        <div class="sky-snow-flake" style="--left: 8%; --duration: 7s; --delay: 0s"></div>
        <div class="sky-snow-flake" style="--left: 22%; --duration: 9s; --delay: -3s"></div>
        <div class="sky-snow-flake" style="--left: 36%; --duration: 6.5s; --delay: -1.5s"></div>
        <div class="sky-snow-flake" style="--left: 50%; --duration: 8s; --delay: -4s"></div>
        <div class="sky-snow-flake" style="--left: 64%; --duration: 7.5s; --delay: -2s"></div>
        <div class="sky-snow-flake" style="--left: 78%; --duration: 9.5s; --delay: -5s"></div>
        <div class="sky-snow-flake" style="--left: 92%; --duration: 6.8s; --delay: -0.8s"></div>
      </div>
      <!-- Starfield (User Story 2) + falling star (User Story 3): purely CSS-gated via
           `.sky-clouds[data-sky='night'][data-weather='sunny'|'mixed']` (app.css) — twelve fixed
           placeholder dots (design.md: no runtime placement algorithm) plus one
           `.sky-falling-star` element that lives inside the starfield layer, "only ever present
           alongside the starfield" per design.md. sky-controller.js never toggles `.sky-star`
           elements directly; it only toggles the falling star's `--play` replay class
           (createFallingStarScheduler()). Placed after the rain/snow particle layers so it
           paints above the night gradient but the drifting `.cloud` elements still paint in
           front of it (same DOM-order-as-paint-order convention used throughout this file). -->
      <div class="sky-stars" aria-hidden="true">
        <div class="sky-star" style="--top: 6%; --left: 8%; --size: 2px; --delay: 0s"></div>
        <div class="sky-star" style="--top: 12%; --left: 22%; --size: 1.5px; --delay: -1.2s"></div>
        <div class="sky-star" style="--top: 4%; --left: 35%; --size: 2px; --delay: -2.4s"></div>
        <div class="sky-star" style="--top: 18%; --left: 48%; --size: 1.5px; --delay: -0.6s"></div>
        <div class="sky-star" style="--top: 8%; --left: 60%; --size: 2.5px; --delay: -3.1s"></div>
        <div class="sky-star" style="--top: 22%; --left: 72%; --size: 1.5px; --delay: -1.8s"></div>
        <div class="sky-star" style="--top: 3%; --left: 85%; --size: 2px; --delay: -2.9s"></div>
        <div class="sky-star" style="--top: 15%; --left: 92%; --size: 1.5px; --delay: -0.9s"></div>
        <div class="sky-star" style="--top: 26%; --left: 15%; --size: 1.5px; --delay: -3.6s"></div>
        <div class="sky-star" style="--top: 20%; --left: 30%; --size: 2px; --delay: -1.5s"></div>
        <div class="sky-star" style="--top: 28%; --left: 55%; --size: 1.5px; --delay: -2.1s"></div>
        <div class="sky-star" style="--top: 24%; --left: 80%; --size: 2px; --delay: -0.3s"></div>
        <div class="sky-falling-star" aria-hidden="true"></div>
      </div>
    </div>
    <!-- Sibling to .sky-clouds, not a descendant: flying-object sprites (User Story 3) need to
         stay crisp, unlike .sky-clouds's contrast-fused gooey clouds. Populated/emptied by
         sky-controller.js; empty (and thus invisible) until the first object spawns. -->
    <div class="sky-flying-objects" aria-hidden="true"></div>
    <!-- Cloud-ceiling accent band (cloudy/rain/snow): a fixed strip right below the nav bar,
         painted on top of `.sky-overcast`/`.sky-clouds`. Built from the same puffy blob shapes as
         the drifting `.cloud` elements (`.sky-ceiling__puff` shares their base circle +
         `::before`/`::after` rules and weather tint in app.css) so it reads as the same cloud
         material, just chunkier and slow-drifting rather than fast like `.cloud` — the dense
         underside of a solid cloud layer close overhead, each category tinted to match its own
         `.cloud` color. Sixteen puffs, staggered by `--delay` at even ~11.25s steps around a 180s
         loop so a new one is always entering as the previous one clears — dense enough that the
         band reads as continuously covered rather than as sixteen distinct clouds passing by.
         `--left`/`--bottom` here are only the `prefers-reduced-motion` fallback position
         (animation off, static per `.sky-ceiling__puff` rules); the drift itself starts
         off-screen at `translateX(-25vw)` regardless of `--left`. Toggled by the same
         `data-weather` attribute on <body> that drives `.sky-overcast` (see app.css's
         `.sky-ceiling` rules). -->
    <div class="sky-ceiling" aria-hidden="true">
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 0%; --scale: 1.1; --bottom: 50px; --delay: 0s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 6%; --scale: 0.95; --bottom: -10px; --delay: -11.25s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 12%; --scale: 1.25; --bottom: 35px; --delay: -22.5s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 19%; --scale: 1; --bottom: 65px; --delay: -33.75s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 25%; --scale: 1.15; --bottom: 0px; --delay: -45s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 31%; --scale: 0.9; --bottom: 45px; --delay: -56.25s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 38%; --scale: 1.3; --bottom: -12px; --delay: -67.5s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 44%; --scale: 1; --bottom: 58px; --delay: -78.75s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 50%; --scale: 1.2; --bottom: 8px; --delay: -90s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 56%; --scale: 0.85; --bottom: 40px; --delay: -101.25s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 62%; --scale: 1.3; --bottom: 68px; --delay: -112.5s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 69%; --scale: 1; --bottom: -8px; --delay: -123.75s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 75%; --scale: 1.15; --bottom: 42px; --delay: -135s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 81%; --scale: 0.9; --bottom: 62px; --delay: -146.25s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 88%; --scale: 1.25; --bottom: -14px; --delay: -157.5s"
      ></div>
      <div
        class="sky-ceiling__puff sky-ceiling__puff--drift"
        style="--left: 94%; --scale: 1.05; --bottom: 33px; --delay: -168.75s"
      ></div>
    </div>
    <noscript>This site requires JavaScript to display your SolarLog production data.</noscript>
    <!-- `.app-chrome` (014-chart-data-table-toggle): sticky wrapper around the header row and its
         mobile sub-nav bar, so both stay pinned to the top of the viewport while a long page (e.g.
         a chart with its data table expanded) scrolls beneath them — see app.css. -->
    <div class="app-chrome">
      <!-- Single combined header+nav row (010-global-info-panel, at the user's request): brand,
           nav links, the info panel (production + weather/forecast), and the transparency
           toggle all live in one `.app-header` row on desktop, where there's room for all of it.
           Below `md:`, `.app-nav__list` and `.info-panel--desktop` both collapse to nothing
           (hidden/dropdown-only), leaving just brand + transparency toggle + burger — the
           mobile-width row this always was. -->
      <header class="app-header">
        <div class="app-header__start">
          <a class="app-header__brand" href="#/">
            <img class="app-header__logo" src="favicon-v2.ico" alt="" />
            <h1 class="app-header__title" id="app-title">SolarLog Viewer</h1>
          </a>
          <nav class="app-nav" id="app-nav">
            <ul id="app-nav-list" class="app-nav__list" data-open="false"></ul>
          </nav>
        </div>
        <div class="app-header__actions">
          <!-- Desktop-only info panel: production + weather/forecast, populated by
             info-panel-controller.js (matches both this and `.info-panel--mobile` below via
             `[data-role]`, see data-model.md's "Info Panel View State"). -->
          <div class="info-panel info-panel--desktop hidden md:flex" data-info-panel="desktop">
            <a class="info-panel__production" data-role="production" data-available="false">
              <span
                class="info-panel__pulse"
                data-role="pulse"
                data-intensity="idle"
                aria-hidden="true"
              ></span>
              <span class="info-panel__production-text">
                <span class="info-panel__value" data-role="production-value">—</span>
                <span class="info-panel__timestamp" data-role="production-timestamp"></span>
              </span>
            </a>
            <!-- Temporary stand-in for the disabled dashboard (see js/views/dashboard.js): plain
               text, not a link, populated by info-panel-controller.js's pollYield/renderYield. -->
            <div class="info-panel__yield" data-role="yield">
              <span class="info-panel__yield-today" data-role="yield-today">—</span>
              <span class="info-panel__yield-month" data-role="yield-month">—</span>
            </div>
            <a
              class="info-panel__weather"
              data-role="weather"
              data-available="false"
              rel="noopener"
              target="_blank"
              hidden
            >
              <span class="info-panel__weather-current" data-role="weather-current">—</span>
              <span class="info-panel__weather-forecast" data-role="weather-forecast">—</span>
            </a>
          </div>
          <div class="lang-switcher" id="lang-switcher"></div>
          <button
            type="button"
            class="transparency-toggle"
            id="transparency-toggle"
            aria-pressed="false"
          ></button>
          <button
            type="button"
            class="app-nav__toggle"
            id="app-nav-toggle"
            aria-expanded="false"
            aria-controls="app-nav-list"
          >
            ☰
          </button>
        </div>
      </header>
      <!-- Mobile-only sub-navigation bar: production + weather/forecast, directly below the
         header (the burger-collapsed nav list drops down from the header itself instead).
         Hidden from `md:` up in favor of `.info-panel--desktop` above. -->
      <div class="info-panel info-panel--mobile flex md:hidden" data-info-panel="mobile">
        <a class="info-panel__production" data-role="production" data-available="false">
          <span
            class="info-panel__pulse"
            data-role="pulse"
            data-intensity="idle"
            aria-hidden="true"
          ></span>
          <span class="info-panel__production-text">
            <span class="info-panel__value" data-role="production-value">—</span>
            <span class="info-panel__timestamp" data-role="production-timestamp"></span>
          </span>
        </a>
        <div class="info-panel__yield" data-role="yield">
          <span class="info-panel__yield-today" data-role="yield-today">—</span>
          <span class="info-panel__yield-month" data-role="yield-month">—</span>
        </div>
        <a
          class="info-panel__weather"
          data-role="weather"
          data-available="false"
          rel="noopener"
          target="_blank"
          hidden
        >
          <span class="info-panel__weather-current" data-role="weather-current">—</span>
          <span class="info-panel__weather-forecast" data-role="weather-forecast">—</span>
        </a>
      </div>
    </div>
    <main class="app-main" id="app-main"></main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
