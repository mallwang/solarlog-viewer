<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolarLog Viewer</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tailwind.generated.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <div class="sky-clouds" aria-hidden="true">
      <div
        class="cloud"
        style="--top: 8%; --scale: 1.4; --duration: 75s; --delay: 0s; --rest-x: 5vw"
      ></div>
      <div
        class="cloud"
        style="--top: 18%; --scale: 0.8; --duration: 50s; --delay: -20s; --rest-x: 30vw"
      ></div>
      <div
        class="cloud"
        style="--top: 4%; --scale: 1; --duration: 65s; --delay: -45s; --rest-x: 60vw"
      ></div>
      <div
        class="cloud"
        style="--top: 24%; --scale: 1.6; --duration: 90s; --delay: -10s; --rest-x: 80vw"
      ></div>
      <div
        class="cloud"
        style="--top: 14%; --scale: 0.6; --duration: 40s; --delay: -30s; --rest-x: 45vw"
      ></div>
      <div
        class="cloud"
        style="--top: 30%; --scale: 1.1; --duration: 80s; --delay: -60s; --rest-x: 10vw"
      ></div>
      <!-- Positioned/shown by sky-controller.js (User Story 2): --x-percent/--y-percent custom
           properties and opacity are set on a 60-second tick from computeSkyBodyPosition(). -->
      <div class="sky-sun" aria-hidden="true" style="--x-percent: 50; --y-percent: 100"></div>
      <div class="sky-moon" aria-hidden="true" style="--x-percent: 50; --y-percent: 100"></div>
    </div>
    <!-- Sibling to .sky-clouds, not a descendant: flying-object sprites (User Story 3) need to
         stay crisp, unlike .sky-clouds's blur+contrast-fused gooey clouds. Populated/emptied by
         sky-controller.js; empty (and thus invisible) until the first object spawns. -->
    <div class="sky-flying-objects" aria-hidden="true"></div>
    <noscript>This site requires JavaScript to display your SolarLog production data.</noscript>
    <header class="app-header">
      <a class="app-header__brand" href="#/">
        <img class="app-header__logo" src="favicon.ico" alt="" />
        <h1 class="app-header__title" id="app-title">SolarLog Viewer</h1>
      </a>
      <div class="app-header__actions">
        <div class="lang-switcher" id="lang-switcher"></div>
        <button
          type="button"
          class="transparency-toggle"
          id="transparency-toggle"
          aria-pressed="false"
        >
          ◐
        </button>
        <button
          type="button"
          class="app-nav__toggle"
          id="app-nav-toggle"
          aria-expanded="false"
          aria-controls="app-nav-list"
        >
          ☰
        </button>
      </div>
    </header>
    <!-- Global desktop info panel (010-global-info-panel): production + weather/forecast,
         populated and shown/hidden by info-panel-controller.js. Hidden by default and only
         ever unhidden on desktop widths (`md:flex`, the same breakpoint gating .app-nav's
         mobile/desktop split) — see app.css's `.info-panel` rules. -->
    <div class="info-panel hidden md:flex" id="info-panel">
      <div class="info-panel__production" id="info-panel-production" data-available="false">
        <span
          class="info-panel__pulse"
          id="info-panel-pulse"
          data-intensity="idle"
          aria-hidden="true"
        ></span>
        <span class="info-panel__value" id="info-panel-production-value">—</span>
      </div>
      <a
        class="info-panel__weather"
        id="info-panel-weather"
        data-available="false"
        rel="noopener"
        target="_blank"
        hidden
      >
        <span class="info-panel__weather-current" id="info-panel-weather-current">—</span>
        <span class="info-panel__weather-forecast" id="info-panel-weather-forecast">—</span>
      </a>
    </div>
    <nav class="app-nav" id="app-nav">
      <ul id="app-nav-list" class="app-nav__list" data-open="false"></ul>
    </nav>
    <main class="app-main" id="app-main"></main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
